<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bay Area Paragliding Conditions</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🪂</span>
        <div>
          <h1>Bay Area Paragliding</h1>
          <p class="subtitle">Conditions &amp; Forecast — Sites within 4 hrs of San Francisco</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="last-updated" class="last-updated"></div>
        <button id="refresh-btn" class="btn-refresh" onclick="loadConditions()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-3.69"></path></svg>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <main>
    <div id="summary-bar" class="summary-bar hidden">
      <div class="summary-chips" id="summary-chips"></div>
    </div>

    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Fetching live weather for all sites…</p>
    </div>

    <div id="error-state" class="error-state hidden">
      <p>⚠️ Failed to load conditions. <a href="#" onclick="loadConditions()">Try again</a></p>
    </div>

    <div id="sites-grid" class="sites-grid hidden"></div>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
